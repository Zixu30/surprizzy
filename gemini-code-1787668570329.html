<!-- Checkout Modal -->
  <div id="checkoutOverlay" class="overlay" onclick="closeCheckout(event)">
    <div class="admin-modal" onclick="event.stopPropagation()">
      <button class="modal-x" onclick="closeCheckout()">×</button>
      <p class="eyebrow">FINAL STEP</p>
      <h2>Checkout</h2>
      
      <div class="checkout-form">
        <input id="custName" class="admin-input" type="text" placeholder="Full Name" required>
        <input id="custPhone" class="admin-input" type="tel" placeholder="Mobile Number" required>
        <textarea id="custAddress" class="admin-input" placeholder="Delivery Address" rows="3" required></textarea>
        
        <div class="payment-methods">
          <p><strong>Select Payment Method:</strong></p>
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="UPI" checked onclick="togglePaymentView('UPI')">
            UPI Payment
          </label>
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="COD" onclick="togglePaymentView('COD')">
            Cash on Delivery (COD)
          </label>
        </div>

        <!-- UPI Details Section -->
        <div id="upiSection" class="upi-details">
          <p>Scan QR or pay to UPI ID:</p>
          <p class="upi-id"><strong>9326567293@omni</strong></p>
          <div class="qr-container">
            <!-- Save the QR code image as 'upi-qr.jpg' in your project root -->
            <img src="upi-qr.jpg" alt="UPI QR Code" style="max-width: 180px; width: 100%; height: auto; border-radius: 8px;">
          </div>
          <input id="upiTxnId" class="admin-input" type="text" placeholder="Enter Transaction ID / UTR (Optional)">
        </div>

        <button class="primary-btn full" onclick="submitOrder()">Confirm Order →</button>
      </div>
    </div>
  </div>

  <!-- Order Confirmation Modal -->
  <div id="confirmationOverlay" class="overlay">
    <div class="admin-modal text-center">
      <div style="font-size: 3rem;">🎉</div>
      <h2>Order Confirmed!</h2>
      <p>Thank you for shopping with Surprizzy.</p>
      <p class="modal-note">Order ID: <strong id="confOrderId"></strong></p>
      <p id="confPaymentDetails"></p>
      <button class="primary-btn full" onclick="closeConfirmation()">Continue Shopping</button>
    </div>
  </div>
